[package]
name = "ferrium"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Filip Materak <filip.materak@nokia.com>"]
description = "A distributed, Raft-replicated key-value store written in Rust"
repository = "https://github.com/fmaterak/ferrium"
license = "MIT"
readme = "README.md"
keywords = ["raft", "consensus", "key-value", "distributed", "database"]
categories = ["database-implementations", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Persistent LSM-tree storage backend (in-memory is the default).
lsm = []
# TLS for client and inter-node traffic.
tls = []
# Deterministic simulation testing (network partitions, crashes).
sim = []
